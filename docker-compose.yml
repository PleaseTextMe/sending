services:
  sending_app:
    build: .
    container_name: please_text_me_sending
    ports:
      - "8001:8001"
    environment:
      - POSTGRES_HOST=please_text_me_postgres_sending
      - POSTGRES_PORT=5432
      - POSTGRES_DB=please_text_me_messages_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secret}
      - REDIS_HOST=please_text_me_redis_sending
      - REDIS_PORT=6379
      - REDIS_DB=0
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - default
      - auth_default

  redis:
    image: redis:7-alpine
    container_name: please_text_me_redis_sending
    ports:
      - "6380:6379"
    volumes:
      - redis_data_sending:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  postgres:
    image: postgres:15-alpine
    container_name: please_text_me_postgres_sending
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: please_text_me_messages_db
    volumes:
      - postgres_data_sending:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data_sending:
  postgres_data_sending:

networks:
  default:
  auth_default:
    external: true
